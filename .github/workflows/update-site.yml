name: Update website

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fedrv-website-production
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out the selected main revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install the pinned npm version
        run: npm install --global npm@11.17.0 --ignore-scripts --no-audit --no-fund
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build static website
        run: npm run build
      - name: Publish and verify the release marker
        run: node scripts/deploy/publish.mjs
        env:
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          DEPLOY_USER: ${{ vars.DEPLOY_USER }}
          DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
          DEPLOY_ROOT: ${{ vars.DEPLOY_ROOT }}
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
